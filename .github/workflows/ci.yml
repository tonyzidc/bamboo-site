name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint + tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check and lint
        run: make lint

      - name: Test suite
        run: make test

  tests-macos:
    name: tests (bash 3.2, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test suite on the system bash
        run: /bin/bash tests/run.sh

  installer:
    name: installer smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the CLI from this checkout
        run: sudo ./install.sh --local --dir /opt/bamboo-site --bin-dir /usr/local/bin --no-deps --yes

      - name: The installed tree is root-owned and not group-writable
        run: |
          owner="$(stat -c '%U:%G' /opt/bamboo-site)"
          test "$owner" = "root:root" || { echo "::error::/opt/bamboo-site is $owner, expected root:root"; exit 1; }
          if find /opt/bamboo-site -perm /022 -type f | grep -q .; then
            echo "::error::installed files are group/other writable"
            exit 1
          fi
          stat -c '%A %n' /opt/bamboo-site/bin/bamboo-site

      - name: The CLI is on PATH and runs
        run: |
          bamboo-site version
          bamboo-site help >/dev/null
          # --dry-run must plan without touching the system (logs go to stderr)
          sudo bamboo-site --dry-run install 2>&1 | grep -q '\[dry-run\]'
          test ! -e /etc/bamboo-site/config

      - name: status --json is valid JSON
        run: |
          sudo bamboo-site status --json > /tmp/status.json || true   # exit 1 on a bare runner is expected
          python3 -c "import json;d=json.load(open('/tmp/status.json'));print('checks:',len(d['checks']),'problems:',d['problems'])"
          sudo bamboo-site status --quiet || true

      - name: Lifecycle (reinstall + rollback + uninstall) against a temp prefix
        run: |
          set -e
          sudo BAMBOO_INSTALL_DIR=/tmp/bs-opt BAMBOO_BIN_DIR=/tmp/bs-bin \
            ./install.sh --local --dir /tmp/bs-opt --bin-dir /tmp/bs-bin --no-deps --yes
          version="$(BAMBOO_ROOT=/tmp/bs-opt /tmp/bs-bin/bamboo-site version)"
          echo "installed: $version"
          sudo BAMBOO_INSTALL_DIR=/tmp/bs-opt BAMBOO_BIN_DIR=/tmp/bs-bin \
            /tmp/bs-bin/bamboo-site reinstall --from . --yes
          test -d /tmp/bs-opt.bak || { echo "::error::no rollback copy"; exit 1; }
          sudo BAMBOO_INSTALL_DIR=/tmp/bs-opt BAMBOO_BIN_DIR=/tmp/bs-bin \
            /tmp/bs-bin/bamboo-site reinstall --rollback --yes
          sudo BAMBOO_INSTALL_DIR=/tmp/bs-opt BAMBOO_BIN_DIR=/tmp/bs-bin \
            /tmp/bs-bin/bamboo-site uninstall --purge --yes
          sleep 2
          if [ -d /tmp/bs-opt ]; then echo "::error::install dir survived uninstall"; exit 1; fi
          if [ -e /tmp/bs-bin/bamboo-site ]; then echo "::error::symlink survived uninstall"; exit 1; fi

      - name: Uninstall removes the CLI
        run: |
          sudo ./install.sh --uninstall --dir /opt/bamboo-site --bin-dir /usr/local/bin --yes
          if command -v bamboo-site >/dev/null 2>&1; then
            echo "::error::bamboo-site is still on PATH after uninstall"
            exit 1
          fi
          if [ -d /opt/bamboo-site ]; then
            echo "::error::/opt/bamboo-site still exists after uninstall"
            exit 1
          fi

  docs:
    name: docs sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for leftover placeholders
        run: |
          if grep -rn '<your-username>' --include='*.md' --include='*.sh' .; then
            echo "::error::placeholder repository URL still present"
            exit 1
          fi
          echo "no placeholders found"
